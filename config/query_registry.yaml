# query_registry.yaml — versioned Query Registry (project brief section 12)
#
# DRAFT v0.1 (Parmida, Day 3) — the brief requires query coverage beyond bare
# country names: actor names, hashtags, military/diplomatic/economic/
# humanitarian terms, and BOTH supportive and opposing phrasing (to avoid
# one-sided Query bias, section 12's "الزامات ارزیابی Query"). This is a
# starting draft, not a finished set — the team should review/extend it and
# spot-check precision/recall before relying on it for the final source
# defense (section 6/7). Record any change here as a new query_id/version,
# don't silently edit an existing query_text once real data has been
# collected under it (breaks reproducibility of which query found what).
#
# Used by youtube_extract_incremental.py via config/query_registry_loader.py.
# The original flat keywords_fa/en/ar in config.yaml are untouched and still
# used by youtube_extract.py (v1) — this registry does not replace that.
#
# 2026-08-08 (Parmida): quota math forced a cut. All 29 non-ar queries × 5
# regions = 145 search.list combos/run = 14,500 units — almost double the
# 8000/day budget, so a real run spent the ENTIRE day's quota on discovery
# alone and fetched 0 comments (see docs/decision_log.md for the incident).
# Trimmed active set to 8 (4 fa + 4 en: topic_1, actor_2, support_1,
# support_2 per language) = 40 combos = 4000 units, leaving headroom for
# video-details + comment fetch. Paused entries below keep active_to instead
# of being deleted, per this file's own convention, so they can be
# reactivated later (e.g. once a week's worth of budget history shows real
# headroom, or the daily budget/quota is raised).
#
# 2026-08-11 (Parmida): superseded the query-trim above with region rotation
# instead — youtube_extract.py now only searches REGIONS_PER_DAY (2) of
# config.yaml's 5 regions per run, cycling through all of them over a 3-day
# window (see regions_for_today() there), rather than searching all 5
# regions every day. That drops the per-day combo count without permanently
# losing query coverage the way pausing queries does, so all 21 previously
# paused entries below are reactivated (active_to reset to null). New math:
# 29 queries × 2 regions/day = 58 combos × 100 = 5,800 units/day, leaving
# 2,200 for video-details + comment fetch. See docs/decision_log.md.

registry_version: "0.3-draft"

