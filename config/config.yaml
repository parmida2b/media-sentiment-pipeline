# config.yaml — single source of truth for "which topic is this pipeline run about"
# Per roadmap_pipeline.md: nothing topic-specific should be hardcoded in the
# extraction/classification/analysis code — it should all be read from here.
# To point the whole pipeline at a new topic, edit this file only.

topic: "جنگ ایران و آمریکا"
topic_id: "iran_us_war"   # ascii slug — used in output paths; change this when the topic changes

keywords_fa: ["جنگ ایران آمریکا"]
keywords_en: ["Iran US war", "Iran America conflict news"]
# keywords_ar removed per docs/source_registry_v3.md SR-006: the project's
# language domain is EN + FA only, Arabic is explicitly "Archived - out of
# scope" (§4-2). query_registry.yaml's ar_* entries are left in place
# (untouched, per that file's own "don't silently edit" rule) but filtered
# out at load time in youtube_extract.py.

date_range:
  start: "2026-02-28"   # 9 Esfand 1404
  end: "auto"           # "auto" = up to now(); or an explicit ISO date like "2026-08-22"
  # NOTE: this only bounds live collection ("how far do we keep fetching new
  # comments"). The project's analytical window end used for
  # project_week/in_window (fixed at 2026-07-22T23:59:59Z per
  # docs/raw_schema_v03.md §10 and docs/source_registry_v3.md §4-1) lives in
  # src/ingestion/project_calendar.py, independent of this "auto" setting -
  # see raw_schema_v03.md §10-1 "Window Lock". search.list calls also pass
  # this fixed END as publishedBefore directly (source_registry_v3.md §4-1).

platforms: ["youtube"]

# Platform-specific knobs. Only youtube_extract.py exists so far; other
# platforms add their own sub-block here when they're built.
youtube:
  regions:              # [regionCode, relevanceLanguage] pairs applied to the
                         # generic keyword search, for source diversity beyond
                         # the curated channel list below
    - ["IR", "fa"]
    - ["US", "en"]
    - ["GB", "en"]
    - ["DE", "de"]
    - ["FR", "fr"]
    # ["AE", "ar"] removed per docs/source_registry_v3.md SR-006 (Arabic is
    # out of scope for this project's language domain, EN + FA only).
  max_videos_per_query: 25
  max_comments_per_video: 300
  explicit_video_ids: ["bQI8B93CnJg"]
  channel_search_query: "Iran US conflict"

  # Curated, topic-specific outlet list — verified at runtime against each
  # channel's own customUrl (src/ingestion/youtube_extract.find_channel_id), so
  # a wrong handle just logs a warning and gets skipped rather than
  # silently pulling in the wrong channel.
  #
  # This list is the 15 "Active" channels from docs/source_registry_v3.md §4
  # (replaces the earlier hand-picked 18-channel list — see
  # docs/decision_log.md). Each entry carries the Source Registry's
  # source_id so it can be written straight onto Record.source_id. Handles
  # for the 7 channels new to this list (source_registry_v3.md's own §9
  # checklist item 2 flags these as still needing manual verification) are
  # best-effort guesses — a wrong handle just logs a warning and is skipped
  # (find_channel_id), it doesn't break the run.
  #
  # Deliberately DROPPED vs the previous list: Press TV / IRIB News (Iran
  # state media - not in source_registry_v3's active set), NYT, CBS News,
  # Sky News, France 24, euronews, RFI, CSIS, DW News (the English DW
  # channel - source_registry_v3 lists DW **Persian** instead).
  channels:
    wire:
      - {name: "Reuters", handle: "reuters", country: "GB", source_id: "YT-001"}
      - {name: "Associated Press", handle: "AP", country: "US", source_id: "YT-002"}
    us_partisan:
      - {name: "CNN", handle: "cnn", country: "US", source_id: "YT-009"}
      - {name: "Fox News", handle: "FoxNews", country: "US", source_id: "YT-013"}
    international:
      - {name: "BBC News", handle: "bbcnews", country: "GB", source_id: "YT-003"}
      - {name: "Al Jazeera English", handle: "aljazeeraenglish", country: "QA", source_id: "YT-004"}
      - {name: "Middle East Eye", handle: "middleeasteye", country: "GB", source_id: "YT-024"}
    non_western:
      - {name: "TRT World", handle: "trtworld", country: "TR", source_id: "YT-018"}
      - {name: "WION", handle: "WIONews", country: "IN", source_id: "YT-022"}
    financial:
      - {name: "Bloomberg Television", handle: "BloombergTelevision", country: "US", source_id: "YT-015"}
    regional_gulf:
      - {name: "Al Arabiya English", handle: "alarabiya", country: "AE", source_id: "YT-026"}
    persian:
      - {name: "BBC Persian", handle: "bbcnewspersian", country: "GB", source_id: "YT-029"}
      - {name: "Iran International", handle: "iranintl", country: "GB", source_id: "YT-030"}
      - {name: "VOA Farsi", handle: "voafarsi", country: "US", source_id: "YT-031"}
      - {name: "DW Persian", handle: "dwpersian", country: "DE", source_id: "YT-034"}

  # Discovery priority order — checkpoint.py resumability means this alone
  # determines what gets covered first across multiple runs/days, no
  # separate "day N" bookkeeping needed. Categories not listed here are
  # still covered, just after these. Persian + wire prioritized first per
  # source_registry_v3.md's "priority to Persian channels, then by volume"
  # note on its reserve/archive ordering (§4-2).
  channel_priority_order:
    - persian
    - wire
    - us_partisan
    - international
    - non_western
    - financial
    - regional_gulf
